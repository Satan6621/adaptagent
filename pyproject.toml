[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptagent"
version = "0.6.0"
description = "AdaptAgent: a lightweight, strongly-typed framework for building, evaluating and self-evolving LLM agent workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AdaptAgent Contributors" }]
keywords = ["agents", "llm", "workflow", "self-evolving", "evolution", "react"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27"]

[project.scripts]
adaptagent = "adaptagent.cli:main"

[project.optional-dependencies]
search = ["ddgs>=9.0"]
all = ["ddgs>=9.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api/asgi.py"

